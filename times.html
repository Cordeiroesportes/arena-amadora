<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus times — Arena Amadora</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10142B">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <div class="container">
    <a class="marca" href="index.html"><span class="apito-ponto"></span>Arena Amadora</a>
    <nav class="nav-links">
      <a href="torneios.html">Torneios</a>
      <a href="ranking.html">Ranking</a>
      <a href="times.html" class="ativo">Meus times</a>
      <a href="perfil.html">Meu perfil</a>
      <a href="#" id="botao-sair">Sair</a>
    </nav>
  </div>
</header>

<main class="pagina">
  <div class="container" style="padding-top:32px;">

    <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; margin-bottom:24px;">
      <div>
        <h1 style="font-size:32px;">Meus times</h1>
        <p class="secao-sub" style="margin-bottom:0;">Crie seu elenco e adicione atletas pelo código deles.</p>
      </div>
      <button id="botao-novo-time" class="btn btn-apito">+ Criar time</button>
    </div>

    <div id="bloco-novo-time" class="form-cartao" style="display:none; max-width:560px; margin-bottom:32px;">
      <h3 style="font-size:20px; margin-bottom:16px;">Novo time</h3>
      <div id="msg-novo-time" class="mensagem"></div>
      <form id="form-time">
        <div class="campo">
          <label for="nt-nome-time">Nome do time</label>
          <input type="text" id="nt-nome-time" required>
        </div>
        <div class="campo" style="display:flex; gap:10px;">
          <div style="flex:1;">
            <label for="nt-modalidade-time">Modalidade</label>
            <select id="nt-modalidade-time" required></select>
          </div>
          <div style="flex:1;">
            <label for="nt-genero-time">Naipe</label>
            <select id="nt-genero-time" required></select>
          </div>
        </div>
        <div class="campo" style="display:flex; gap:10px;">
          <div style="flex:2;">
            <label for="nt-cidade-time">Cidade</label>
            <input type="text" id="nt-cidade-time">
          </div>
          <div style="flex:1;">
            <label for="nt-estado-time">UF</label>
            <select id="nt-estado-time"></select>
          </div>
        </div>
        <button type="submit" class="btn btn-apito btn-bloco">Criar time</button>
      </form>
    </div>

    <div id="lista-times">
      <div class="vazio">Carregando seus times...</div>
    </div>

  </div>
</main>

<footer class="rodape">
  <div class="container">Arena Amadora — conectando o esporte de várzea no Brasil.</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="times.js"></script>
</body>
</html>
