<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu perfil — Arena Amadora</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#10142B">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <div class="container">
    <a class="marca" href="index.html"><span class="apito-ponto"></span>Arena Amadora</a>
    <nav class="nav-links">
      <a href="torneios.html">Torneios</a>
      <a href="ranking.html">Ranking</a>
      <a href="perfil.html" class="ativo">Meu perfil</a>
      <a href="#" id="botao-sair">Sair</a>
    </nav>
  </div>
</header>

<main class="pagina">
  <div class="container" style="padding-top:40px; max-width:560px;">

    <div id="bloco-carregando" class="mensagem ok" style="display:block;">Carregando seu perfil...</div>

    <div id="bloco-perfil" style="display:none;">

      <div id="cartao-codigo" class="sumula" style="display:none; margin-bottom:24px; text-align:center;">
        <div class="sumula-modalidade">Seu código de atleta</div>
        <h2 style="font-family:var(--fonte-dado); font-size:38px; letter-spacing:0.05em; margin:8px 0;" id="texto-codigo"></h2>
        <p style="font-size:13px; color:var(--tinta-suave); margin:0;">
          Informe esse código ao seu técnico para entrar em um time.
        </p>
      </div>

      <h1 style="font-size:26px; margin-bottom:16px;">Meus dados</h1>

      <form id="form-perfil" class="form-cartao">
        <div id="msg-perfil" class="mensagem"></div>

        <div class="campo">
          <label for="pf-nome">Nome completo</label>
          <input type="text" id="pf-nome" required>
        </div>

        <div class="campo">
          <label>E-mail</label>
          <input type="email" id="pf-email" disabled>
        </div>

        <div class="campo">
          <label for="pf-telefone">Telefone / WhatsApp</label>
          <input type="tel" id="pf-telefone">
        </div>

        <div class="campo" id="bloco-nascimento">
          <label for="pf-nascimento">Data de nascimento</label>
          <input type="date" id="pf-nascimento">
        </div>

        <div class="campo" style="display:flex; gap:10px;">
          <div style="flex:2;">
            <label for="pf-cidade">Cidade</label>
            <input type="text" id="pf-cidade">
          </div>
          <div style="flex:1;">
            <label for="pf-estado">UF</label>
            <select id="pf-estado"></select>
          </div>
        </div>

        <div class="campo">
          <label>Você quer participar como</label>
          <div class="campo-checks">
            <label><input type="checkbox" id="pf-tipo-atleta"> Atleta / jogador</label>
            <label><input type="checkbox" id="pf-tipo-organizador"> Organizador de torneio</label>
          </div>
          <p style="font-size:12px; color:var(--tinta-suave); margin-top:6px;">
            Marcar "atleta" gera seu código automaticamente ao salvar, se você ainda não tiver um.
          </p>
        </div>

        <div class="campo">
          <label>Modalidades de interesse</label>
          <div class="campo-checks" id="pf-modalidades"></div>
        </div>

        <button type="submit" class="btn btn-apito btn-bloco">Salvar alterações</button>
      </form>
    </div>

  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="perfil.js"></script>
</body>
</html>
