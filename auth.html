<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar ou cadastrar — Arena Amadora</title>
<meta name="description" content="Cadastre-se como atleta ou organizador e centralize seus dados na Arena Amadora.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#163829">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <div class="container">
    <a class="marca" href="index.html"><span class="apito-ponto"></span>Arena Amadora</a>
    <nav class="nav-links">
      <a href="torneios.html">Torneios</a>
      <a href="auth.html" class="ativo">Entrar</a>
    </nav>
  </div>
</header>

<main class="pagina">
  <div class="container" style="padding-top:40px; max-width:560px;">

    <div id="aviso-logado" class="mensagem ok" style="display:none;"></div>

    <div class="abas">
      <div class="aba ativa" id="aba-login">Entrar</div>
      <div class="aba" id="aba-cadastro">Cadastrar</div>
    </div>

    <!-- LOGIN -->
    <form id="form-login" class="form-cartao" style="display:block;">
      <div id="msg-login" class="mensagem"></div>
      <div class="campo">
        <label for="log-email">E-mail</label>
        <input type="email" id="log-email" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="log-senha">Senha</label>
        <input type="password" id="log-senha" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-apito btn-bloco">Entrar</button>
    </form>

    <!-- CADASTRO -->
    <form id="form-cadastro" class="form-cartao" style="display:none;">
      <div id="msg-cadastro" class="mensagem"></div>

      <div class="campo">
        <label for="cad-nome">Nome completo</label>
        <input type="text" id="cad-nome" required autocomplete="name">
      </div>
      <div class="campo">
        <label for="cad-email">E-mail</label>
        <input type="email" id="cad-email" required autocomplete="email">
      </div>
      <div class="campo">
        <label for="cad-senha">Senha (mínimo 6 caracteres)</label>
        <input type="password" id="cad-senha" required minlength="6" autocomplete="new-password">
      </div>
      <div class="campo">
        <label for="cad-telefone">Telefone / WhatsApp</label>
        <input type="tel" id="cad-telefone" placeholder="(31) 90000-0000">
      </div>

      <div class="campo" id="bloco-nascimento">
        <label for="cad-nascimento">Data de nascimento</label>
        <input type="date" id="cad-nascimento" autocomplete="bday">
        <p style="font-size:12px; color:var(--tinta-suave); margin-top:6px;">
          Usamos só pra gerar seu código de atleta. Não pedimos CPF, RG nem outros documentos —
          a checagem de documento, quando necessária, é feita presencialmente pelo organizador.
        </p>
      </div>

      <div class="campo" style="display:flex; gap:10px;">
        <div style="flex:2;">
          <label for="cad-cidade">Cidade</label>
          <input type="text" id="cad-cidade">
        </div>
        <div style="flex:1;">
          <label for="cad-estado">UF</label>
          <select id="cad-estado"></select>
        </div>
      </div>

      <div class="campo">
        <label>Você quer participar como</label>
        <div class="campo-checks">
          <label><input type="checkbox" id="cad-tipo-atleta" checked> Atleta / jogador</label>
          <label><input type="checkbox" id="cad-tipo-organizador"> Organizador de torneio</label>
        </div>
      </div>

      <div class="campo" id="bloco-equipe" style="display:none;">
        <label for="cad-nome-equipe">Nome da equipe (opcional)</label>
        <input type="text" id="cad-nome-equipe">
      </div>

      <div class="campo">
        <label>Modalidades de interesse</label>
        <div class="campo-checks" id="cad-modalidades"></div>
      </div>

      <button type="submit" class="btn btn-apito btn-bloco">Criar minha conta</button>
    </form>

  </div>
</main>

<footer class="rodape">
  <div class="container">Arena Amadora — conectando o esporte de várzea no Brasil.</div>
</footer>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
</body>
</html>
