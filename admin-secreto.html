<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Arena Amadora</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topo">
  <div class="container">
    <a class="marca" href="index.html"><span class="apito-ponto"></span>Arena Amadora · Painel</a>
    <nav class="nav-links">
      <span id="admin-usuario-atual" style="opacity:0.8;"></span>
      <a href="#" id="botao-sair">Sair</a>
    </nav>
  </div>
</header>

<main class="pagina">
  <div class="container" style="padding-top:32px;">

    <div id="admin-login" style="display:none;">
      <h1 style="font-size:26px; margin-bottom:16px;">Entrar no painel</h1>
      <form id="form-admin-login" class="form-cartao">
        <div id="msg-admin-login" class="mensagem"></div>
        <div class="campo">
          <label for="admin-email">E-mail</label>
          <input type="email" id="admin-email" required>
        </div>
        <div class="campo">
          <label for="admin-senha">Senha</label>
          <input type="password" id="admin-senha" required>
        </div>
        <button type="submit" class="btn btn-apito btn-bloco">Entrar</button>
      </form>
    </div>

    <div id="admin-negado" style="display:none;">
      <div class="mensagem erro" style="display:block;">
        Sua conta está autenticada, mas não tem permissão para acessar este painel.
      </div>
    </div>

    <div id="admin-painel" style="display:none;">
      <section class="secao" style="padding-top:0;">
        <h2 class="secao-titulo">Torneios pendentes</h2>
        <p class="secao-sub">Revise e aprove para que apareçam na listagem pública.</p>
        <div id="lista-pendentes" class="grade-cartoes"></div>
      </section>

      <section class="secao">
        <h2 class="secao-titulo">Torneios aprovados</h2>
        <div id="lista-aprovados" class="grade-cartoes"></div>
      </section>
    </div>

  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="admin.js"></script>
<script>
  // Garante que o formulário de login apareça se ninguém estiver logado
  document.addEventListener("DOMContentLoaded", function () {
    auth.onAuthStateChanged(function (user) {
      if (!user) document.getElementById("admin-login").style.display = "block";
    });
  });
</script>
</body>
</html>
